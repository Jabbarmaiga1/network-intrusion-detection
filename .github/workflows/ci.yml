name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax of all Python files
        run: python -m py_compile *.py

      - name: Smoke-test the API (synthetic-data demo model)
        run: |
          python -c "
          import api
          client_resp = api.root()
          assert client_resp['message']
          print('API import and root() check passed')
          "
